name: deploy-paper

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "submission/paper_url.txt"
      - "work/paper_publication_check.py"
      - ".github/workflows/deploy-paper.yml"
  workflow_dispatch:

jobs:
  verify-public-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publication safety and claim check
        run: python work/paper_publication_check.py

      - name: Verify recorded public paper URL
        run: |
          set -e
          url="$(tr -d '\r\n' < submission/paper_url.txt)"
          case "$url" in
            https://*) ;;
            *) echo "::error::submission/paper_url.txt must contain exactly one https:// URL"; exit 1 ;;
          esac

          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -L -o /tmp/paper.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Attempt $attempt returned HTTP $code"
            sleep 10
          done

          if [ "$code" != "200" ]; then
            echo "::error::Public paper URL returned HTTP $code"
            exit 1
          fi

          grep -Fqi "Which Content Pages Should Be Reviewed First?" /tmp/paper.html
          grep -Fqi "Built on the FlyRank ML Internship dataset" /tmp/paper.html
          grep -Fqi "capstone_model_vs_baseline.png" /tmp/paper.html

          echo "LIVE_PAPER_URL=$url"
          echo "Public paper reachable and expected title, data credit, and figure reference are present."
