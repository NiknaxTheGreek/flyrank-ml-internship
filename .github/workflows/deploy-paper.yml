name: deploy-paper

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "work/paper_publication_check.py"
      - ".github/workflows/deploy-paper.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publication safety and claim check
        run: python work/paper_publication_check.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload paper artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy paper to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
