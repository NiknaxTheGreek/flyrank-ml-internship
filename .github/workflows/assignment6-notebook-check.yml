name: assignment6-notebook-check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment6-notebook-check.yml"

permissions:
  contents: write

jobs:
  execute-assignment6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat nbclient ipykernel

      - name: Execute Assignment 6 notebook cleanly
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          path = "work/notebooks/w05_model.ipynb"
          nb = nbformat.read(path, as_version=4)
          client = NotebookClient(
              nb,
              timeout=1200,
              kernel_name="python3",
              resources={"metadata": {"path": "work/notebooks"}},
          )
          client.execute()
          nbformat.write(nb, path)
          print("ASSIGNMENT6_NOTEBOOK_EXECUTED_CLEANLY")
          PY

      - name: Audit execution state and receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb_path = Path("work/notebooks/w05_model.ipynb")
          nb = json.load(open(nb_path, encoding="utf-8"))
          code = [c for c in nb["cells"] if c["cell_type"] == "code"]
          assert len(code) == 4, f"Expected 4 code cells, found {len(code)}"
          assert all(c.get("execution_count") is not None for c in code), "Unexecuted code cell found"
          for c in code:
              assert all(o.get("output_type") != "error" for o in c.get("outputs", [])), "Error output found"

          benchmark = Path("work/outputs/assignment6_model_benchmark.json")
          errors = Path("work/outputs/assignment6_error_audit.json")
          assert benchmark.exists(), "Missing Assignment 6 model benchmark receipt"
          assert errors.exists(), "Missing Assignment 6 error audit receipt"

          result = json.load(open(benchmark, encoding="utf-8"))
          assert result["split"]["train_pages"] == 1800
          assert result["split"]["test_pages"] == 720
          assert result["split"]["train_clients"] == 15
          assert result["split"]["test_clients"] == 6

          print("Code cells executed:", len(code))
          print("CLASSIFICATION_ROC_AUC", result["classification"]["model"]["roc_auc"])
          print("REGRESSION_RMSE", result["regression"]["model"]["rmse"])
          print("RANKING_PRECISION_AT_50", result["ranking"]["model"]["precision_at_50"])
          print("ASSIGNMENT6_AUDIT_PASSED")
          PY

      - name: Commit executed notebook and receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w05_model.ipynb
          git add -f work/outputs/assignment6_model_benchmark.json
          git add -f work/outputs/assignment6_error_audit.json
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute and audit Assignment 6 notebook [skip ci]"
            git push
          fi
