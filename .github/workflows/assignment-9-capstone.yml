name: assignment-9-capstone

on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/capstone.ipynb"
      - ".github/workflows/assignment-9-capstone.yml"
      - "work/outputs/**"
      - "docs/ml-intern-dataset-and-lane-guide.md"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: assignment-9-capstone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-capstone:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          pip install -r requirements.txt
          pip install nbformat nbclient ipykernel pandas

      - name: Execute capstone notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          src = "work/notebooks/capstone.ipynb"
          out = "work/notebooks/capstone.executed.ipynb"

          nb = nbformat.read(src, as_version=4)
          client = NotebookClient(
              nb,
              timeout=300,
              kernel_name="python3",
              resources={"metadata": {"path": "work/notebooks"}},
          )
          client.execute()
          nbformat.write(nb, out)
          print(f"EXECUTED_NOTEBOOK={out}")
          PY

      - name: Print capstone outputs
        if: always()
        run: |
          python - <<'PY'
          import os
          import nbformat

          paths = [
              "work/notebooks/capstone.executed.ipynb",
              "work/notebooks/capstone.ipynb",
          ]
          path = next((p for p in paths if os.path.exists(p)), None)
          if path is None:
              raise SystemExit("No capstone notebook found.")

          nb = nbformat.read(path, as_version=4)
          for i, cell in enumerate(nb.cells):
              if cell.cell_type != "code" or not cell.get("outputs"):
                  continue
              print(f"===== CELL {i} =====")
              for out in cell.outputs:
                  if out.output_type == "stream":
                      print(out.text)
                  elif out.output_type in ("execute_result", "display_data"):
                      data = out.get("data", {})
                      if "text/plain" in data:
                          print(data["text/plain"])
                  elif out.output_type == "error":
                      print(out.get("ename"), out.get("evalue"))
          PY

      - name: Save executed notebook
        if: success()
        run: |
          cp work/notebooks/capstone.executed.ipynb work/notebooks/capstone.ipynb
          rm work/notebooks/capstone.executed.ipynb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/capstone.ipynb

          if git diff --cached --quiet; then
            echo "No capstone execution changes to commit."
          else
            git commit -m "Save executed Assignment 9 capstone [skip ci]"
            git push
          fi
