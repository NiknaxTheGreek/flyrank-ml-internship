name: assignment6-tuned-model-check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment6-tuned-model-check.yml"

permissions:
  contents: write

jobs:
  execute-assignment6-tuned:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat nbclient ipykernel

      - name: Execute tuned Assignment 6 notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          path = "work/notebooks/w05_model.ipynb"
          nb = nbformat.read(path, as_version=4)
          client = NotebookClient(
              nb,
              timeout=2400,
              kernel_name="python3",
              resources={"metadata": {"path": "work/notebooks"}},
          )
          client.execute()
          nbformat.write(nb, path)
          print("ASSIGNMENT6_TUNED_NOTEBOOK_EXECUTED")
          PY

      - name: Audit tuned outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb = json.load(open("work/notebooks/w05_model.ipynb", encoding="utf-8"))
          code = [c for c in nb["cells"] if c["cell_type"] == "code"]
          assert all(c.get("execution_count") is not None for c in code)
          assert all(
              all(o.get("output_type") != "error" for o in c.get("outputs", []))
              for c in code
          )

          p = Path("work/outputs/assignment6_model_benchmark.json")
          assert p.exists()
          result = json.load(open(p, encoding="utf-8"))

          print("CLASSIFICATION_BASELINE", result["classification"]["baseline"]["roc_auc"])
          print("CLASSIFICATION_TUNED", result["classification"]["model"]["roc_auc"])
          print("REGRESSION_BASELINE", result["regression"]["baseline"]["rmse"])
          print("REGRESSION_TUNED", result["regression"]["model"]["rmse"])
          print("RANKING_BASELINE", result["ranking"]["baseline"]["precision_at_50"])
          print("RANKING_TUNED", result["ranking"]["model"]["precision_at_50"])
          print("ASSIGNMENT6_TUNED_AUDIT_PASSED")
          PY

      - name: Commit tuned notebook and receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w05_model.ipynb
          git add -f work/outputs/assignment6_model_benchmark.json
          git add -f work/outputs/assignment6_error_audit.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Execute tuned Assignment 6 models [skip ci]"
            git push
          fi
