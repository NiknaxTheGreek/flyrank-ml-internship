name: data-path-smoke

# Executes Assignment 4 against the exact gated FlyRank warehouse release
# referenced by this repository and saves the executed outputs back to the
# deliverable notebook.
on:
  push:
    branches: [main]
    paths:
      - "work/notebooks/w03_data_contract.ipynb"
      - "notebooks/03_working_with_the_full_release.ipynb"
      - "requirements.txt"
      - ".github/workflows/data-path-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-assignment-4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require the repository HF_TOKEN
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Install notebook runtime
        run: |
          pip install -r requirements.txt
          pip install nbformat nbclient ipykernel pandas duckdb

      - name: Execute Assignment 4 against the gated warehouse
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          src = "work/notebooks/w03_data_contract.ipynb"
          out = "work/notebooks/w03_data_contract.executed.ipynb"

          nb = nbformat.read(src, as_version=4)
          client = NotebookClient(
              nb,
              timeout=1500,
              kernel_name="python3",
              resources={"metadata": {"path": "work/notebooks"}},
          )
          client.execute()
          nbformat.write(nb, out)
          print(f"EXECUTED_NOTEBOOK={out}")
          PY

      - name: Print Assignment 4 outputs
        run: |
          python - <<'PY'
          import nbformat

          path = "work/notebooks/w03_data_contract.executed.ipynb"
          nb = nbformat.read(path, as_version=4)

          for i, cell in enumerate(nb.cells):
              if cell.cell_type != "code" or not cell.get("outputs"):
                  continue
              print(f"===== CELL {i} =====")
              for out in cell.outputs:
                  if out.output_type == "stream":
                      print(out.text)
                  elif out.output_type in ("execute_result", "display_data"):
                      data = out.get("data", {})
                      if "text/plain" in data:
                          print(data["text/plain"])
                  elif out.output_type == "error":
                      print(out.get("ename"), out.get("evalue"))
          PY

      - name: Upload executed Assignment 4 notebook
        uses: actions/upload-artifact@v4
        with:
          name: w03-data-contract-executed
          path: work/notebooks/w03_data_contract.executed.ipynb
          if-no-files-found: error
          retention-days: 7

      - name: Save executed outputs into the deliverable notebook
        run: |
          cp work/notebooks/w03_data_contract.executed.ipynb work/notebooks/w03_data_contract.ipynb
          rm work/notebooks/w03_data_contract.executed.ipynb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add work/notebooks/w03_data_contract.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Save executed Assignment 4 outputs [skip ci]"
            git push
          fi
