name: Execute Assignment 1 notebooks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Execute Notebook 01
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01_first_look_and_discovery.ipynb \
            --output 01_first_look_and_discovery.ipynb \
            --output-dir notebooks \
            --ExecutePreprocessor.timeout=900

      - name: Execute Notebook 02
        run: |
          jupyter nbconvert --to notebook --execute notebooks/02_your_first_readable_model.ipynb \
            --output 02_your_first_readable_model.ipynb \
            --output-dir notebooks \
            --ExecutePreprocessor.timeout=900

      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: assignment1-executed-notebooks
          path: |
            notebooks/01_first_look_and_discovery.ipynb
            notebooks/02_your_first_readable_model.ipynb
          if-no-files-found: error
