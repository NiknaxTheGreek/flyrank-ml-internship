name: Execute Assignment 1 notebooks

on:
  push:
    paths:
      - ".github/workflows/assignment1-execute.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Execute Notebook 01
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01_first_look_and_discovery.ipynb \
            --output 01_first_look_and_discovery.ipynb \
            --output-dir notebooks \
            --ExecutePreprocessor.timeout=900

      - name: Execute Notebook 02
        run: |
          jupyter nbconvert --to notebook --execute notebooks/02_your_first_readable_model.ipynb \
            --output 02_your_first_readable_model.ipynb \
            --output-dir notebooks \
            --ExecutePreprocessor.timeout=900

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_first_look_and_discovery.ipynb notebooks/02_your_first_readable_model.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute Assignment 1 notebooks [skip ci]"
            git push
          fi
