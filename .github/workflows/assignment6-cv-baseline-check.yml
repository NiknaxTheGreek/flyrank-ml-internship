name: assignment6-cv-baseline-check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment6-cv-baseline-check.yml"

permissions:
  contents: write

jobs:
  execute-assignment6-cv:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat nbclient ipykernel

      - name: Execute Assignment 6
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          path = "work/notebooks/w05_model.ipynb"
          nb = nbformat.read(path, as_version=4)
          NotebookClient(
              nb,
              timeout=2400,
              kernel_name="python3",
              resources={"metadata": {"path": "work/notebooks"}},
          ).execute()
          nbformat.write(nb, path)
          print("ASSIGNMENT6_CV_EXECUTED")
          PY

      - name: Audit and print CV comparison
        run: |
          python - <<'PY'
          import json
          result = json.load(open("work/outputs/assignment6_model_benchmark.json"))
          assert "cv_baselines" in result
          for row in result["cv_baselines"]["comparison"]:
              print(row)
          nb = json.load(open("work/notebooks/w05_model.ipynb"))
          code = [c for c in nb["cells"] if c["cell_type"] == "code"]
          assert all(c.get("execution_count") is not None for c in code)
          assert all(all(o.get("output_type") != "error" for o in c.get("outputs", [])) for c in code)
          print("ASSIGNMENT6_CV_AUDIT_PASSED")
          PY

      - name: Commit executed notebook and receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w05_model.ipynb
          git add -f work/outputs/assignment6_model_benchmark.json
          git add -f work/outputs/assignment6_error_audit.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Execute Assignment 6 grouped CV baseline comparison [skip ci]"
            git push
          fi

